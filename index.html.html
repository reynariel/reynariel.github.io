<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wheel of Life</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #666;
            cursor: pointer;
        }
        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #666;
            cursor: pointer;
            border: none;
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <h3>Are you reading this line?</h3>

    <script type="text/babel">
        const { useState } = React;

        function WheelOfLife() {
          const [categories] = useState([
            'Health',
            'Career',
            'Finances',
            'Relationships',
            'Personal Growth',
            'Fun & Recreation',
            'Environment',
            'Family'
          ]);
          
          const [scores, setScores] = useState(
            categories.reduce((acc, cat) => ({ ...acc, [cat]: 5 }), {})
          );

          const segmentColors = [
            '#FFB3D9', // Pastel Pink
            '#FFB84D', // Pastel Orange
            '#FFF4A3', // Pastel Yellow
            '#A3E4F7', // Pastel Cyan
            '#C5B4E3', // Pastel Purple
            '#B4F8C8', // Pastel Green
            '#FFC0E5', // Pastel Rose
            '#D4A5F9'  // Pastel Lavender
          ];

          const segmentGradientSettings = [
            { start: 0.2, end: 1.0 },  // Deep Pink - wider gradient range
            { start: 0.35, end: 0.95 }, // Vibrant Orange - moderate gradient
            { start: 0.25, end: 1.0 },  // Bright Yellow - wide gradient
            { start: 0.4, end: 0.9 },   // Cyan - narrower gradient
            { start: 0.3, end: 1.0 },   // Medium Slate Blue - wide gradient
            { start: 0.35, end: 0.85 }, // Lime Green - moderate gradient
            { start: 0.25, end: 0.95 }, // Hot Pink - wide gradient
            { start: 0.3, end: 0.9 }    // Purple - moderate gradient
          ];

          const centerX = 300;
          const centerY = 300;
          const maxRadius = 200;
          const levels = 10;

          const handleScoreChange = (category, value) => {
            setScores(prev => ({ ...prev, [category]: parseInt(value) }));
          };

          const polarToCartesian = (angle, radius) => {
            const rad = (angle - 90) * Math.PI / 180;
            return {
              x: centerX + radius * Math.cos(rad),
              y: centerY + radius * Math.sin(rad)
            };
          };

          const getGradientColor = (baseColor, level, maxLevel, segmentIndex) => {
            const r = parseInt(baseColor.slice(1, 3), 16);
            const g = parseInt(baseColor.slice(3, 5), 16);
            const b = parseInt(baseColor.slice(5, 7), 16);
            
            const { start, end } = segmentGradientSettings[segmentIndex];
            const range = end - start;
            
            let factor;
            if (level <= 5) {
              factor = start + (level / 5) * (range * 0.4);
            } else if (level <= 9) {
              factor = start + (range * 0.4) + ((level - 5) / 4) * (range * 0.5);
            } else {
              factor = end;
            }
            
            const newR = Math.round(r * factor);
            const newG = Math.round(g * factor);
            const newB = Math.round(b * factor);
            
            return `rgb(${newR}, ${newG}, ${newB})`;
          };

          const anglePerSegment = 360 / categories.length;

          return (
            <div className="min-h-screen bg-gradient-to-br from-purple-50 to-blue-50 p-8">
              <div className="max-w-7xl mx-auto">
                <div className="text-center mb-8">
                  <h1 className="text-4xl font-bold text-gray-800 mb-2">Wheel of Life</h1>
                  <p className="text-gray-600">Rate each area of your life from 0 to 10</p>
                </div>

                <div className="grid lg:grid-cols-2 gap-8 items-start">
                  <div className="bg-white rounded-2xl shadow-lg p-8">
                    <svg width="600" height="600" className="mx-auto">
                      {[...Array(levels)].map((_, i) => {
                        const radius = maxRadius * (i + 1) / levels;
                        return (
                          <circle
                            key={`circle-${i}`}
                            cx={centerX}
                            cy={centerY}
                            r={radius}
                            fill="none"
                            stroke="#f0f0f0"
                            strokeWidth="1"
                            strokeDasharray="5,5"
                          />
                        );
                      })}

                      {categories.map((category, idx) => {
                        const startAngle = idx * anglePerSegment;
                        const endAngle = (idx + 1) * anglePerSegment;
                        const score = scores[category];

                        return (
                          <g key={category}>
                            {[...Array(score)].map((_, level) => {
                              const innerRadius = maxRadius * level / levels;
                              const outerRadius = maxRadius * (level + 1) / levels;
                              const levelColor = getGradientColor(segmentColors[idx], level + 1, levels, idx);
                              
                              const midAngle = (startAngle + endAngle) / 2;
                              
                              const innerStart = polarToCartesian(startAngle, innerRadius * 0.4);
                              const innerEnd = polarToCartesian(endAngle, innerRadius * 0.4);
                              const outerStart = polarToCartesian(startAngle, outerRadius);
                              const outerEnd = polarToCartesian(endAngle, outerRadius);
                              
                              const outerControlRadius = outerRadius * 1.1;
                              const outerControl = polarToCartesian(midAngle, outerControlRadius);
                              
                              const innerControlRadius = innerRadius * 0.4;
                              const innerControl = polarToCartesian(midAngle, innerControlRadius);
                              
                              const path = `
                                M ${innerStart.x} ${innerStart.y}
                                Q ${innerControl.x} ${innerControl.y} ${innerEnd.x} ${innerEnd.y}
                                L ${outerEnd.x} ${outerEnd.y}
                                Q ${outerControl.x} ${outerControl.y} ${outerStart.x} ${outerStart.y}
                                Z
                              `;
                              
                              return (
                                <path
                                  key={`${category}-level-${level}`}
                                  d={path}
                                  fill={levelColor}
                                  stroke="white"
                                  strokeWidth="1.5"
                                  opacity="0.9"
                                />
                              );
                            })}
                          </g>
                        );
                      })}

                      {categories.map((category, idx) => {
                        const angle = (idx * anglePerSegment) + (anglePerSegment / 2);
                        const labelRadius = maxRadius + 40;
                        const pos = polarToCartesian(angle, labelRadius);
                        const scoreRadius = maxRadius * scores[category] / levels * 0.7;
                        const scorePos = polarToCartesian(angle, Math.max(scoreRadius, 30));
                        
                        return (
                          <g key={`label-${category}`}>
                            <text
                              x={pos.x}
                              y={pos.y}
                              fontSize="14"
                              fill="#333"
                              fontWeight="600"
                              textAnchor="middle"
                              dominantBaseline="middle"
                            >
                              {category}
                            </text>
                            
                            {scores[category] > 0 && (
                              <text
                                x={scorePos.x}
                                y={scorePos.y}
                                fontSize="20"
                                fill="#333"
                                fontWeight="bold"
                                textAnchor="middle"
                                dominantBaseline="middle"
                                style={{ textShadow: '1px 1px 2px rgba(255,255,255,0.8)' }}
                              >
                                {scores[category]}
                              </text>
                            )}
                          </g>
                        );
                      })}

                      <circle cx={centerX} cy={centerY} r="30" fill="white" stroke="#ddd" strokeWidth="2" />
                      <text
                        x={centerX}
                        y={centerY}
                        fontSize="12"
                        fill="#666"
                        fontWeight="600"
                        textAnchor="middle"
                        dominantBaseline="middle"
                      >
                        Life
                      </text>
                    </svg>
                  </div>

                  <div className="bg-white rounded-2xl shadow-lg p-8">
                    <h2 className="text-2xl font-semibold text-gray-800 mb-6">Adjust Your Scores</h2>
                    <div className="space-y-6">
                      {categories.map((category, idx) => (
                        <div key={category}>
                          <div className="flex justify-between items-center mb-2">
                            <label className="text-sm font-semibold text-gray-700 flex items-center">
                              <span 
                                className="w-5 h-5 rounded-full mr-3 border-2 border-gray-300" 
                                style={{ backgroundColor: segmentColors[idx] }}
                              ></span>
                              {category}
                            </label>
                            <span 
                              className="text-2xl font-bold px-3 py-1 rounded-lg"
                              style={{ 
                                backgroundColor: segmentColors[idx],
                                color: 'white'
                              }}
                            >
                              {scores[category]}
                            </span>
                          </div>
                          <input
                            type="range"
                            min="0"
                            max="10"
                            value={scores[category]}
                            onChange={(e) => handleScoreChange(category, e.target.value)}
                            className="w-full h-3 rounded-lg appearance-none cursor-pointer"
                            style={{
                              background: `linear-gradient(to right, ${segmentColors[idx]} 0%, ${segmentColors[idx]} ${scores[category] * 10}%, #e0e0e0 ${scores[category] * 10}%, #e0e0e0 100%)`
                            }}
                          />
                          <div className="flex justify-between text-xs text-gray-400 mt-1">
                            <span>0</span>
                            <span>5</span>
                            <span>10</span>
                          </div>
                        </div>
                      ))}
                    </div>

                    <div className="mt-8 p-4 bg-gray-50 rounded-lg">
                      <div className="text-center">
                        <div className="text-sm text-gray-600">Average Score</div>
                        <div className="text-4xl font-bold text-purple-600 mt-1">
                          {(Object.values(scores).reduce((a, b) => a + b, 0) / categories.length).toFixed(1)}
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        ReactDOM.render(<WheelOfLife />, document.getElementById('root'));
    </script>
</body>
</html>
